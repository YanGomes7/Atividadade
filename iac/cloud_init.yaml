#cloud-config
hostname: ${hostname}
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_key}

package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - python3

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
