<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Produtos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 15px; }
    label { display: block; margin-top: 10px; }
    input { padding: 6px; width: 100%; max-width: 360px; }
    button { margin-top: 15px; padding: 8px 16px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
    #msg { margin-top: 10px; font-weight: bold; }
  </style>
  <script src="config.js"></script>
</head>
<body>
  <h1>Cadastro de Produtos</h1>
  <form id="form">
    <label>Nome do produto <input name="nome" type="text" required></label>
    <label>Categoria <input name="categoria" type="text" required></label>
    <label>Preço <input name="preco" type="number" step="0.01" min="0" required></label>
    <label>Quantidade em estoque <input name="quantidade" type="number" step="1" min="0" required></label>
    <button type="submit">Cadastrar</button>
  </form>
  <div id="msg"></div>

  <p><a href="#" id="listar">Listar todos os produtos</a></p>
  <table id="tabela" hidden>
    <thead><tr><th>ID</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Estoque</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const msg = document.getElementById('msg');

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const body = {
        nome: f.nome.value,
        categoria: f.categoria.value,
        preco: parseFloat(f.preco.value),
        quantidade: parseInt(f.quantidade.value, 10),
      };
      try {
        const r = await fetch(window.API_URL + '/produto', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) throw new Error((await r.json()).erro || r.status);
        msg.textContent = 'Produto cadastrado com sucesso!';
        f.reset();
      } catch (err) {
        msg.textContent = 'Erro ao cadastrar: ' + err.message;
      }
    });

    document.getElementById('listar').addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        const r = await fetch(window.API_URL + '/produtos');
        if (!r.ok) throw new Error(r.status);
        const lista = await r.json();
        const tbody = document.querySelector('#tabela tbody');
        tbody.innerHTML = '';
        lista.forEach((p) => {
          const tr = document.createElement('tr');
          [p.id, p.nome, p.categoria, Number(p.preco).toFixed(2), p.quantidade].forEach((v) => {
            const td = document.createElement('td');
            td.textContent = v;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        document.getElementById('tabela').hidden = false;
      } catch (err) {
        msg.textContent = 'Erro ao listar: ' + err.message;
      }
    });
  </script>
</body>
</html>
